<h1 mat-dialog-title>{{ data.list.label }}</h1>

<div mat-dialog-content>
  @if (data.list.description) {
    <p class="list-description">{{ data.list.description }}</p>
  }
  <p class="list-count">{{ keywords.length }} keyword{{ keywords.length === 1 ? '' : 's' }}</p>

  @if (keywords.length > 0) {
    <div class="keyword-chips">
      @for (keyword of keywords; track keyword) {
        <span class="keyword-chip">{{ keyword }}</span>
      }
    </div>
  } @else {
    <p class="empty-message">No keywords in this list.</p>
  }

</div>

<div mat-dialog-actions align="end">
  <button mat-button class="tlr-dialog-btn tlr-dialog-btn--primary" mat-dialog-close>Close</button>
</div>
