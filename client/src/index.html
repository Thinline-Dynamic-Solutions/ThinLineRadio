<!doctype html>
<html lang="en">

<head>
    <base href="./">
    <link rel="apple-touch-icon" sizes="192x192" id="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" id="favicon-32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" id="favicon-16" href="assets/icons/favicon-16x16.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta charset="utf-8">
    <script>
        (function () {
            if (typeof Object.hasOwn !== 'function') {
                Object.defineProperty(Object, 'hasOwn', {
                    configurable: true,
                    writable: true,
                    value: function (obj, prop) {
                        return Object.prototype.hasOwnProperty.call(Object(obj), prop);
                    }
                });
            }
            if (typeof Array.prototype.at !== 'function') {
                Object.defineProperty(Array.prototype, 'at', {
                    configurable: true,
                    writable: true,
                    value: function (n) {
                        var len = this.length >>> 0;
                        var i = Math.trunc(n) || 0;
                        if (i < 0) { i += len; }
                        if (i < 0 || i >= len) { return undefined; }
                        return this[i];
                    }
                });
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ThinLine Radio</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#06080c">
    <link rel="stylesheet" href="assets/fonts/web/fonts.css">
    <!-- Try to use custom favicon if uploaded -->
    <script>
        (function() {
            // Check if custom favicon exists
            fetch('/favicon', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        // Custom favicon exists, use it for all icons
                        var appleTouchIcon = document.getElementById('apple-touch-icon');
                        var favicon32 = document.getElementById('favicon-32');
                        var favicon16 = document.getElementById('favicon-16');
                        
                        if (appleTouchIcon) appleTouchIcon.href = '/favicon';
                        if (favicon32) favicon32.href = '/favicon';
                        if (favicon16) favicon16.href = '/favicon';
                    }
                })
                .catch(function() {
                    // Custom favicon doesn't exist, keep default icons
                });
        })();
    </script>
    <!-- Block Chrome/Edge password-save prompts on the admin panel -->
    <script>
        (function () {
            // Tell the browser credential manager not to auto-fill or track credentials
            if (navigator.credentials && navigator.credentials.preventSilentAccess) {
                navigator.credentials.preventSilentAccess();
            }

            function isAdminPage() {
                return window.location.pathname.includes('/admin');
            }

            function disableAutocomplete(root) {
                if (!isAdminPage()) return;
                root.querySelectorAll('input, textarea').forEach(function (el) {
                    // Leave the login form alone
                    if (el.closest('rdio-scanner-admin-login, .login-form')) return;
                    var ac = el.getAttribute('autocomplete');
                    if (!ac || ac === 'on') {
                        el.setAttribute('autocomplete',
                            el.type === 'password' ? 'new-password' : 'off');
                    }
                });
                root.querySelectorAll('form').forEach(function (el) {
                    if (el.closest('rdio-scanner-admin-login, .login-form')) return;
                    if (!el.getAttribute('autocomplete')) {
                        el.setAttribute('autocomplete', 'off');
                    }
                });
            }

            // Run on initial load and on every DOM mutation (Angular renders dynamically)
            var observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    m.addedNodes.forEach(function (node) {
                        if (node.nodeType === 1) disableAutocomplete(node);
                    });
                });
            });

            document.addEventListener('DOMContentLoaded', function () {
                disableAutocomplete(document.body);
                observer.observe(document.body, { childList: true, subtree: true });
            });
        })();
    </script>
    <!-- Capture invitation code BEFORE Angular loads -->
    <script>
        (function() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var inviteCode = urlParams.get('invite');
                if (inviteCode) {
                    console.log('Captured invitation code from URL:', inviteCode);
                    sessionStorage.setItem('pendingInviteCode', inviteCode);
                }
            } catch (e) {
                console.error('Error capturing invite code:', e);
            }
        })();
    </script>
</head>

<body>
    <div id="tlr-boot" hidden></div>
    <app-root></app-root>
    <noscript>
        Please enable JavaScript to continue using this application.
    </noscript>
    <script>
        (function () {
            var BOOT_VERSION = '26.09.24';
            var started = Date.now();
            var boot = document.getElementById('tlr-boot');
            function hasApp() {
                var root = document.querySelector('app-root');
                return !!(root && root.children && root.children.length);
            }
            function hideBoot() {
                if (boot && boot.parentNode) { boot.parentNode.removeChild(boot); }
            }
            function paintStuck() {
                if (!boot) { return; }
                boot.hidden = false;
                boot.textContent = 'ThinLine Radio could not start. Close this window and open the site again.';
            }
            function recover() {
                var already;
                try { already = sessionStorage.getItem('tlr-sw-recover-v') === BOOT_VERSION; } catch (e) {}
                if (already) {
                    paintStuck();
                    return;
                }
                try { sessionStorage.setItem('tlr-sw-recover-v', BOOT_VERSION); } catch (e) {}
                function go() {
                    var u = new URL(location.href);
                    u.searchParams.set('ngsw-bypass', '1');
                    location.replace(u.toString());
                }
                if (!('serviceWorker' in navigator)) { go(); return; }
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister(); }));
                }).then(function () {
                    if (!('caches' in window)) { return; }
                    return caches.keys().then(function (keys) {
                        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    });
                }).then(go).catch(go);
            }
            function tick() {
                if (hasApp()) {
                    hideBoot();
                    return;
                }
                if (Date.now() - started < 8000) {
                    setTimeout(tick, 400);
                    return;
                }
                recover();
            }
            setTimeout(tick, 2500);
        })();
    </script>
</body>

</html>
